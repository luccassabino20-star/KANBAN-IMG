[build]
  command = "npm run build"
  publish = "dist"

# Troque a URL abaixo pela URL do backend depois de fazer o deploy dele (ex: Render).
[[redirects]]
  from = "/api/*"
  to = "https://SEU-BACKEND.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
