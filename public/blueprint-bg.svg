<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 1000" preserveAspectRatio="xMidYMid slice" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="gridMinor" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8a8a92" stroke-width="0.5" opacity="0.05" />
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a92" opacity="0.5" />
    </marker>
  </defs>

  <rect width="1900" height="1000" fill="url(#gridMinor)" />

  <!-- ground line -->
  <line x1="0" y1="760" x2="1900" y2="760" stroke="#8a8a92" stroke-width="1" opacity="0.22" />

  <!-- ===== Skyline: multiple buildings ===== -->
  <g fill="none" stroke="#8a8a92" stroke-width="1.5" stroke-linecap="square" opacity="0.26">
    <!-- building 1 -->
    <rect x="40" y="500" width="130" height="260" />
    <line x1="40" y1="565" x2="170" y2="565" />
    <line x1="40" y1="630" x2="170" y2="630" />
    <line x1="40" y1="695" x2="170" y2="695" />

    <!-- building 2 -->
    <rect x="200" y="380" width="100" height="380" />
    <line x1="200" y1="440" x2="300" y2="440" />
    <line x1="200" y1="500" x2="300" y2="500" />
    <line x1="200" y1="560" x2="300" y2="560" />
    <line x1="200" y1="620" x2="300" y2="620" />
    <line x1="200" y1="680" x2="300" y2="680" />

    <!-- slim tower with antenna -->
    <rect x="507" y="520" width="28" height="240" />
    <line x1="521" y1="520" x2="521" y2="490" />
    <line x1="507" y1="590" x2="535" y2="590" />
    <line x1="507" y1="660" x2="535" y2="660" />
    <line x1="507" y1="710" x2="535" y2="710" />

    <!-- building 4 (tallest, under construction) -->
    <rect x="540" y="250" width="90" height="510" stroke-dasharray="3 5" />
    <line x1="540" y1="320" x2="630" y2="320" stroke-dasharray="3 5" />
    <line x1="540" y1="390" x2="630" y2="390" stroke-dasharray="3 5" />
    <line x1="540" y1="460" x2="630" y2="460" stroke-dasharray="3 5" />
    <line x1="540" y1="530" x2="630" y2="530" stroke-dasharray="3 5" />
    <line x1="540" y1="600" x2="630" y2="600" stroke-dasharray="3 5" />
    <line x1="540" y1="670" x2="630" y2="670" stroke-dasharray="3 5" />

    <!-- building 5 -->
    <rect x="660" y="430" width="120" height="330" />
    <line x1="660" y1="500" x2="780" y2="500" />
    <line x1="660" y1="570" x2="780" y2="570" />
    <line x1="660" y1="640" x2="780" y2="640" />
    <line x1="660" y1="700" x2="780" y2="700" />

    <!-- small house (pitched roof) -->
    <polyline points="805,690 855,645 905,690" />
    <rect x="815" y="690" width="80" height="70" />
    <line x1="850" y1="720" x2="850" y2="760" />
    <line x1="835" y1="720" x2="865" y2="720" />
    <line x1="880" y1="660" x2="880" y2="635" />

    <!-- building 7 -->
    <rect x="960" y="330" width="150" height="430" />
    <line x1="960" y1="400" x2="1110" y2="400" />
    <line x1="960" y1="470" x2="1110" y2="470" />
    <line x1="960" y1="540" x2="1110" y2="540" />
    <line x1="960" y1="610" x2="1110" y2="610" />
    <line x1="960" y1="680" x2="1110" y2="680" />

    <!-- building 9 -->
    <rect x="1300" y="410" width="130" height="350" />
    <line x1="1300" y1="480" x2="1430" y2="480" />
    <line x1="1300" y1="550" x2="1430" y2="550" />
    <line x1="1300" y1="620" x2="1430" y2="620" />
    <line x1="1300" y1="690" x2="1430" y2="690" />

  </g>

  <!-- water tower -->
  <g stroke="#8a8a92" stroke-width="1.25" fill="none" opacity="0.24">
    <ellipse cx="1840" cy="510" rx="46" ry="14" />
    <ellipse cx="1840" cy="575" rx="46" ry="14" />
    <line x1="1794" y1="510" x2="1794" y2="575" />
    <line x1="1886" y1="510" x2="1886" y2="575" />
    <line x1="1815" y1="586" x2="1780" y2="760" />
    <line x1="1865" y1="586" x2="1900" y2="760" />
    <line x1="1798" y1="700" x2="1852" y2="668" />
    <line x1="1882" y1="700" x2="1828" y2="668" />
  </g>

  <!-- crane on the building under construction -->
  <g stroke="#8a8a92" stroke-width="1.25" fill="none" opacity="0.26" stroke-linecap="round">
    <line x1="585" y1="250" x2="585" y2="120" />
    <line x1="585" y1="130" x2="700" y2="140" />
    <line x1="585" y1="130" x2="545" y2="138" />
    <line x1="670" y1="141" x2="670" y2="205" />
  </g>

  <!-- dimension line under the skyline -->
  <g stroke="#8a8a92" stroke-width="1" opacity="0.16">
    <line x1="40" y1="800" x2="1900" y2="800" />
    <line x1="40" y1="792" x2="40" y2="808" />
    <line x1="540" y1="792" x2="540" y2="808" />
    <line x1="1110" y1="792" x2="1110" y2="808" />
    <line x1="1900" y1="792" x2="1900" y2="808" />
  </g>

  <!-- ===== Structural calculation sketches ===== -->

  <!-- A: simply supported beam, distributed load and bending-moment diagram -->
  <g stroke="#8a8a92" fill="none" opacity="0.2">
    <g stroke-width="1.25">
      <line x1="80" y1="150" x2="380" y2="150" />
      <polygon points="80,150 68,176 92,176" />
      <polygon points="380,150 368,176 392,176" />
      <line x1="66" y1="180" x2="74" y2="188" />
      <line x1="76" y1="180" x2="84" y2="188" />
      <line x1="86" y1="180" x2="94" y2="188" />
      <line x1="366" y1="180" x2="374" y2="188" />
      <line x1="376" y1="180" x2="384" y2="188" />
      <line x1="386" y1="180" x2="394" y2="188" />
      <line x1="100" y1="110" x2="360" y2="110" />
    </g>
    <g stroke-width="1" marker-end="url(#arrow)">
      <line x1="100" y1="110" x2="100" y2="146" />
      <line x1="130" y1="110" x2="130" y2="146" />
      <line x1="160" y1="110" x2="160" y2="146" />
      <line x1="190" y1="110" x2="190" y2="146" />
      <line x1="220" y1="110" x2="220" y2="146" />
      <line x1="250" y1="110" x2="250" y2="146" />
      <line x1="280" y1="110" x2="280" y2="146" />
      <line x1="310" y1="110" x2="310" y2="146" />
      <line x1="340" y1="110" x2="340" y2="146" />
      <line x1="360" y1="110" x2="360" y2="146" />
    </g>
    <g stroke-width="0.75" marker-start="url(#arrow)" marker-end="url(#arrow)">
      <line x1="80" y1="205" x2="380" y2="205" />
    </g>
    <path d="M 80 232 Q 230 268 380 232" stroke-width="1.25" />
    <g font-size="14" stroke="none" fill="#8a8a92">
      <text x="58" y="98">q</text>
      <text x="222" y="200">L</text>
      <text x="215" y="258">M</text>
      <text x="52" y="52">&#931;F = 0</text>
      <text x="240" y="52">&#931;M = 0</text>
      <text x="270" y="245" font-size="12">M = qL&#178;/8</text>
    </g>
  </g>

  <!-- A2: quick calc results table -->
  <g opacity="0.19">
    <g stroke="#8a8a92" stroke-width="1">
      <rect x="1460" y="70" width="230" height="140" fill="none" />
      <line x1="1460" y1="105" x2="1690" y2="105" />
      <line x1="1460" y1="140" x2="1690" y2="140" />
      <line x1="1460" y1="175" x2="1690" y2="175" />
      <line x1="1565" y1="70" x2="1565" y2="210" />
    </g>
    <g font-size="12.5" stroke="none" fill="#8a8a92">
      <text x="1472" y="92">N (kN)</text>
      <text x="1600" y="92">184,20</text>
      <text x="1472" y="127">V (kN)</text>
      <text x="1600" y="127">62,70</text>
      <text x="1472" y="162">M (kN&#183;m)</text>
      <text x="1600" y="162">120,40</text>
      <text x="1472" y="197">&#963; (MPa)</text>
      <text x="1600" y="197">8,35</text>
    </g>
  </g>

  <!-- B: column cross-section with rebar -->
  <g stroke="#8a8a92" fill="none" opacity="0.2">
    <rect x="1210" y="60" width="140" height="140" stroke-width="1.25" />
    <rect x="1225" y="75" width="110" height="110" stroke-width="0.75" stroke-dasharray="2 4" />
    <circle cx="1225" cy="75" r="6" stroke-width="1" />
    <circle cx="1335" cy="75" r="6" stroke-width="1" />
    <circle cx="1225" cy="185" r="6" stroke-width="1" />
    <circle cx="1335" cy="185" r="6" stroke-width="1" />
    <circle cx="1280" cy="75" r="5" stroke-width="1" />
    <circle cx="1280" cy="185" r="5" stroke-width="1" />
    <g stroke-width="0.75" marker-start="url(#arrow)" marker-end="url(#arrow)">
      <line x1="1210" y1="218" x2="1350" y2="218" />
    </g>
    <line x1="1350" y1="120" x2="1378" y2="120" stroke-width="0.75" />
    <circle cx="1350" cy="120" r="2" fill="#8a8a92" stroke="none" />
    <g font-size="12" stroke="none" fill="#8a8a92">
      <text x="1210" y="46">&#216;12,5 c/15</text>
      <text x="1265" y="234">h</text>
      <text x="1382" y="124">fck 30MPa</text>
    </g>
  </g>

  <!-- C: force equilibrium diagram -->
  <g stroke="#8a8a92" fill="none" opacity="0.2">
    <circle cx="850" cy="140" r="3" stroke-width="1" />
    <g stroke-width="1.1" marker-end="url(#arrow)">
      <line x1="850" y1="140" x2="850" y2="62" />
      <line x1="850" y1="140" x2="928" y2="100" />
      <line x1="850" y1="140" x2="792" y2="182" />
    </g>
    <path d="M 850 105 A 38 38 0 0 1 878 118" stroke-width="0.75" />
    <g font-size="13" stroke="none" fill="#8a8a92">
      <text x="858" y="66">F1</text>
      <text x="932" y="98">F2</text>
      <text x="762" y="190">F3</text>
      <text x="866" y="104" font-size="11">35&#176;</text>
      <text x="796" y="54">&#931;F = 0</text>
    </g>
  </g>

  <!-- D: stacked calc notes -->
  <g opacity="0.19">
    <g stroke="#8a8a92" stroke-width="0.75" fill="none">
      <line x1="345" y1="468" x2="345" y2="612" />
      <line x1="345" y1="468" x2="353" y2="468" />
      <line x1="345" y1="612" x2="353" y2="612" />
      <line x1="345" y1="622" x2="512" y2="622" />
    </g>
    <g font-size="13" stroke="none" fill="#8a8a92">
      <text x="362" y="486">Ed = 1,4G + 1,4Q</text>
      <text x="362" y="516">fyd = fyk / 1,15</text>
      <text x="362" y="546">fcd = fck / 1,4</text>
      <text x="362" y="576">Vsd &#8804; VRd2</text>
      <text x="362" y="606">&#961; = As / (b&#183;d)</text>
    </g>
  </g>

  <!-- E: steel I-beam (perfil W) cross-section -->
  <g opacity="0.19">
    <g stroke="#8a8a92" stroke-width="1.1" fill="none">
      <rect x="1165" y="460" width="90" height="14" />
      <rect x="1165" y="606" width="90" height="14" />
      <rect x="1203" y="474" width="14" height="132" />
    </g>
    <g stroke="#8a8a92" stroke-width="0.75" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)">
      <line x1="1148" y1="460" x2="1148" y2="620" />
      <line x1="1165" y1="638" x2="1255" y2="638" />
    </g>
    <g font-size="12" stroke="none" fill="#8a8a92">
      <text x="1165" y="444">W 460x74</text>
      <text x="1128" y="544">d</text>
      <text x="1204" y="655">bf</text>
    </g>
  </g>

  <!-- F: concrete stress-strain diagram (parábola-retângulo) -->
  <g opacity="0.19">
    <g stroke="#8a8a92" stroke-width="1" fill="none" marker-end="url(#arrow)">
      <line x1="1500" y1="622" x2="1500" y2="468" />
      <line x1="1500" y1="622" x2="1662" y2="622" />
    </g>
    <path d="M 1500 622 Q 1518 542 1545 520 L 1608 520" stroke="#8a8a92" stroke-width="1.25" fill="none" />
    <g stroke="#8a8a92" stroke-width="0.6" stroke-dasharray="2 4" fill="none">
      <line x1="1608" y1="520" x2="1608" y2="622" />
      <line x1="1500" y1="520" x2="1545" y2="520" />
    </g>
    <g font-size="11.5" stroke="none" fill="#8a8a92">
      <text x="1506" y="478">&#963;c</text>
      <text x="1642" y="640">&#949;c</text>
      <text x="1550" y="514">fcd</text>
      <text x="1572" y="640">&#949;cu = 3,5&#8240;</text>
      <text x="1500" y="656" font-size="12">fcd = 0,85 fck / &#947;c</text>
    </g>
  </g>

  <!-- ===== Drafting instruments (bottom strip) ===== -->

  <!-- graphic scale ruler -->
  <g opacity="0.18">
    <g stroke="#8a8a92" stroke-width="1" fill="none">
      <rect x="60" y="855" width="340" height="16" />
      <line x1="102.5" y1="855" x2="102.5" y2="871" />
      <line x1="145" y1="855" x2="145" y2="871" />
      <line x1="187.5" y1="855" x2="187.5" y2="871" />
      <line x1="230" y1="855" x2="230" y2="871" />
      <line x1="272.5" y1="855" x2="272.5" y2="871" />
      <line x1="315" y1="855" x2="315" y2="871" />
      <line x1="357.5" y1="855" x2="357.5" y2="871" />
    </g>
    <g fill="#8a8a92" opacity="0.7">
      <rect x="60" y="855" width="42.5" height="16" />
      <rect x="145" y="855" width="42.5" height="16" />
      <rect x="230" y="855" width="42.5" height="16" />
      <rect x="315" y="855" width="42.5" height="16" />
    </g>
    <g font-size="10" stroke="none" fill="#8a8a92">
      <text x="55" y="888">0</text>
      <text x="140" y="888">20</text>
      <text x="225" y="888">40</text>
      <text x="310" y="888">60</text>
      <text x="370" y="888">80</text>
      <text x="60" y="840" font-size="11">ESCALA 1:100</text>
    </g>
  </g>

  <!-- compass (compasso) -->
  <g stroke="#8a8a92" stroke-width="1.1" fill="none" opacity="0.18">
    <circle cx="500" cy="838" r="4" />
    <line x1="500" y1="838" x2="500" y2="822" />
    <line x1="500" y1="838" x2="468" y2="935" />
    <line x1="500" y1="838" x2="536" y2="928" />
    <circle cx="536" cy="928" r="2.5" />
  </g>

  <!-- set square (esquadro 45°) -->
  <g stroke="#8a8a92" stroke-width="1.1" fill="none" opacity="0.18">
    <polygon points="600,940 720,940 720,850" />
    <circle cx="680" cy="905" r="9" />
    <line x1="605" y1="928" x2="613" y2="940" />
    <line x1="625" y1="928" x2="633" y2="940" />
    <line x1="645" y1="928" x2="653" y2="940" />
  </g>

  <!-- protractor (transferidor) -->
  <g stroke="#8a8a92" stroke-width="1.1" fill="none" opacity="0.18">
    <path d="M 780 940 A 60 60 0 0 1 900 940" />
    <line x1="780" y1="940" x2="900" y2="940" />
    <line x1="840" y1="940" x2="840" y2="882" />
    <line x1="840" y1="940" x2="798" y2="898" />
    <line x1="840" y1="940" x2="882" y2="898" />
    <circle cx="840" cy="940" r="2" />
  </g>
</svg>
